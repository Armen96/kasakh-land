<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="KASAKH 910">
  <rect width="100" height="100" rx="20" fill="#1e3d32"/>
  <!--
    The plot's own silhouette, from the cadastral plan: corners 1-2-3-4, the
    32 m road frontage along the bottom. Solid rather than outlined so the
    shape still reads at 16px, with the frontage picked out in gold.
  -->
  <polygon points="87.3,84 24.1,84 12.7,8 42.7,8" fill="#faf8f4"/>
  <line x1="24.1" y1="92" x2="87.3" y2="92"
        stroke="#c9a961" stroke-width="7" stroke-linecap="round"/>
</svg>
